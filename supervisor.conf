
; =========================================================
; Free Arbitrage Mesh — Supervisor Configuration
; Version: 2.3.0
; =========================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; =========================================================
; 1. FASTAPI MAIN SUPERVISOR
; =========================================================

[program:api]
command=python -u main_supervisor.py
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
priority=10
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

; =========================================================
; 2. JAVA SIMULATION ENGINE
; =========================================================

[program:java-engine]
command=java -Xms64m -Xmx192m -XX:+UseSerialGC -XX:MaxDirectMemorySize=32m -jar /app/engine.jar
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
priority=20
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8"

; =========================================================
; 3. PRICE MONITOR / SCRAPER
; =========================================================

[program:scraper]
command=python -u scraper_engine.py
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
priority=30
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

; =========================================================
; 4. TASK HUNTER
; =========================================================

[program:task-hunter]
command=python -u task_hunter.py
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
priority=40
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
