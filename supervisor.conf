
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
childlogdir=/tmp

[program:fastapi_web]
command=uvicorn main_supervisor:app --host 0.0.0.0 --port 10000 --workers 1
directory=/app
priority=10
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:java_engine]
command=java -Xmx192m -Xms128m -XX:+UseSerialGC -XX:MaxDirectMemorySize=64m -jar engine.jar
directory=/app
priority=20
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:playwright_scraper]
command=python -u scraper_engine.py
directory=/app
priority=30
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:task_hunter]
command=python -u task_hunter.py
directory=/app
priority=40
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
