
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
loglevel=info

[program:fastapi_web]
command=python -u main_supervisor.py
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
priority=10
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:java_engine]
command=java -Xms64m -Xmx192m -XX:+UseSerialGC -XX:MaxDirectMemorySize=32m -jar /app/engine.jar
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
priority=20
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:playwright_scraper]
command=python -u scraper_engine.py
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
priority=30
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:task_hunter]
command=python -u task_hunter.py
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=5
priority=40
stopsignal=TERM
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
