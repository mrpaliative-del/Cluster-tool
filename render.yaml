
services:
  - type: web
    name: free-arbitrage-mesh
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      - key: PYTHON_ENV
        value: production

      - key: LOG_LEVEL
        value: INFO
